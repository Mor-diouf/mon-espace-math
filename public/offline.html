<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#18453c" />
    <title>Pas de connexion — Mon Espace Math</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      :root {
        --bg: #f6f8f4;
        --fg: #14231f;
        --muted: #5b6b66;
        --primary: #18453c;
        --on-primary: #ffffff;
        --card: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a2922;
          --fg: #eef3f0;
          --muted: #a7b8b2;
          --primary: #9bc227;
          --on-primary: #0a2922;
          --card: #12362e;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      img {
        width: 88px;
        height: 88px;
        border-radius: 50%;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 1.375rem;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }
      .actions {
        margin-top: 28px;
        display: grid;
        gap: 10px;
      }
      a,
      button {
        display: flex;
        height: 48px;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }
      button {
        border: 0;
        background: var(--primary);
        color: var(--on-primary);
      }
      a {
        border: 1px solid color-mix(in srgb, var(--fg) 20%, transparent);
        background: var(--card);
        color: var(--fg);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Pas de connexion</h1>
      <p>
        Cette page n'a pas encore été ouverte sur ce téléphone. Vos documents gardés hors ligne
        restent disponibles.
      </p>
      <div class="actions">
        <button onclick="location.reload()">Réessayer</button>
        <a href="/mes-docs">Mes documents hors ligne</a>
      </div>
    </main>
  </body>
</html>
